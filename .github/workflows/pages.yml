name: Verify and deploy NuanceBridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test translation and privacy boundaries
        run: npm test
      - name: Package only public app files
        run: |
          mkdir _site
          cp index.html styles.css writing.css app.js translation.js preferences.js demo.js writing-session.js review-api.js writing-ui.js writing-demo.js intent-state.js intent-ui.js memory-store.js memory-ui.js workflow-state.js writing-panels.js writing-voice.js ui-helpers.js selection-ui.js flow-ui.js selection-position.js selection-popover.js favicon.svg _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
